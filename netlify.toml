# Netlify build and deploy configuration
# DL Business Systems Ltd — People & Sponsor Compliance platform

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Skip the build (and spend no build minutes) when a push changes nothing that
  # affects the built site, e.g. documentation or Supabase migration files.
  # Exit 0 = skip, exit 1 = build. Forces a build on the first run (no cache ref).
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json package-lock.json vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json tailwind.config.js postcss.config.js"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: route all paths to index.html so React Router handles them
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
